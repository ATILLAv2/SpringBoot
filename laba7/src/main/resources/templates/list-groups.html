<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>List Groups</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/v/bs4/dt-1.10.25/datatables.min.css"/>
</head>
<body>
<div class="container">
    <h3>List Groups</h3>
    <hr/>
    <a th:href="@{/groups/addGroupForm}" class="btn btn-primary mb-3">Add Group</a>
    <a th:href="@{/list}" class="btn btn-info mb-3">Go to Students</a>

    <table class="table table-bordered table-striped" id="groupTable">
        <thead>
        <tr>
            <th>Group Name</th>
            <th>Specialty</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="group : ${groups}">
            <td th:text="${group.groupName}"></td>
            <td th:text="${group.specialty}"></td>
            <td th:text="${group.course}"></td>
            <td>
                <a th:href="@{/groups/showUpdateForm(groupId=${group.id})}" class="btn btn-info btn-sm">Update</a>
                <a th:href="@{/groups/deleteGroup(groupId=${group.id})}" class="btn btn-danger btn-sm ml-2">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.10.25/datatables.min.js"></script>
<script>
    $(document).ready(function () {
        $("#groupTable").DataTable({
            'aoColumnDefs': [{
                'bSortable': false,
                'aTargets': [-1]
            }]
        });
    });
</script>
</body>
</html>
