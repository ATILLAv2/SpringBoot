<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h3>Add New Group</h3>
    <hr/>
    <form th:action="@{/groups/saveGroup}" th:object="${group}" method="POST">
        <input type="hidden" th:field="*{id}"/>
        <input type="text" th:field="*{groupName}" class="form-control col-4 mb-4" placeholder="Enter Group Name"/>
        <input type="text" th:field="*{specialty}" class="form-control col-4 mb-4" placeholder="Enter Specialty"/>
        <input type="text" th:field="*{course}" class="form-control col-4 mb-4" placeholder="Enter Course"/>
        <button type="submit" class="btn btn-primary col-2">Save</button>
    </form>
    <hr/>
    <a th:href="@{/groups/list}">Back to groups list</a>
</div>
</body>
</html>
