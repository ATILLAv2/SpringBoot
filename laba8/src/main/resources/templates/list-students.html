<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>List Students</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h3>List Students</h3>
    <hr/>
    <a th:href="@{/addStudentForm}" class="btn btn-primary mb-3">Add Student</a>
    <a th:href="@{/users}" class="btn btn-info mb-3">List Users</a>
    <a th:href="@{/logout}" class="btn btn-danger mb-3">Logout</a>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>Name</th>
            <th>Surname</th>
            <th>Faculty</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.name}"></td>
            <td th:text="${student.surname}"></td>
            <td th:text="${student.faculty}"></td>
            <td th:text="${student.age}"></td>
            <td>
                <a th:href="@{/showUpdateForm(studentId=${student.id})}" class="btn btn-info btn-sm">Update</a>
                <a th:href="@{/deleteStudent(studentId=${student.id})}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
