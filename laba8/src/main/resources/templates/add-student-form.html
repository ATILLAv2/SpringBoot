<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h3>Add New Student</h3>
    <hr/>
    <form th:action="@{/saveStudent}" th:object="${student}" method="POST">
        <input type="hidden" th:field="*{id}"/>
        <input type="text" th:field="*{name}" class="form-control mb-3" placeholder="Enter Name"/>
        <input type="text" th:field="*{surname}" class="form-control mb-3" placeholder="Enter Surname"/>
        <input type="text" th:field="*{faculty}" class="form-control mb-3" placeholder="Enter Faculty"/>
        <input type="text" th:field="*{age}" class="form-control mb-3" placeholder="Enter Age"/>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
    <hr/>
    <a th:href="@{/list}">Back to list</a>
</div>
</body>
</html>
